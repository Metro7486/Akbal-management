<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Akbal Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF9F6;
            --surface: #ffffff;
            --surface-2: #f5f3ee;
            --gold-accent: #c5a059;
            --gold-bright: #d4af37;
            --gold-dark: #8e6d2d;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --text-faint: #999999;
            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.14);
            --success: #2e7d32;
            --warn: #c2820e;
            --danger: #c62828;
            --info: #1565c0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Montserrat', system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ============ LOGIN VIEW ============ */
        #login-view {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 40px 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.08);
        }
        .login-logo {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            text-align: center;
            letter-spacing: 6px;
            color: var(--gold-dark);
            background: linear-gradient(to bottom, var(--gold-dark), var(--gold-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .login-subtitle {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }
        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .field input, .field select, .field textarea {
            width: 100%;
            padding: 11px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field textarea { min-height: 90px; resize: vertical; font-family: inherit; }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none;
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 3px rgba(197,160,89,0.15);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--surface-2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(135deg, var(--gold-accent), var(--gold-dark));
            color: #fff;
            border-color: var(--gold-dark);
        }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-full { width: 100%; }
        .btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text-main); }
        .msg {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            display: none;
        }
        .msg-error { background: rgba(198,40,40,0.08); color: var(--danger); display: block; }
        .msg-info { background: rgba(21,101,192,0.08); color: var(--info); display: block; }

        /* ============ DASHBOARD VIEW ============ */
        #dashboard-view { display: none; }
        .header {
            position: sticky;
            top: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .header-brand {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: var(--gold-dark);
        }
        .header-brand small {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-left: 8px;
        }
        .header-right { display: flex; gap: 12px; align-items: center; font-size: 0.78rem; color: var(--text-muted); }
        .header-right .who { font-weight: 500; color: var(--text-main); }

        .main { padding: 24px; max-width: 1400px; margin: 0 auto; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .stat-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .stat-value { font-size: 1.6rem; font-weight: 600; color: var(--text-main); margin-top: 4px; }
        .stat-value.gold { color: var(--gold-dark); }

        .toolbar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .field { margin: 0; min-width: 130px; }
        .toolbar .field.search { flex: 1; min-width: 220px; }
        .toolbar .field label { margin-bottom: 4px; }

        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
        }
        th {
            background: var(--surface-2);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 600;
        }
        tbody tr { cursor: pointer; transition: background 0.15s; }
        tbody tr:hover { background: var(--surface-2); }
        tbody tr:last-child td { border-bottom: none; }
        .empty {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-faint);
            font-size: 0.85rem;
        }
        .pill {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pill-new { background: rgba(21,101,192,0.1); color: var(--info); }
        .pill-reviewing { background: rgba(194,130,14,0.12); color: var(--warn); }
        .pill-accepted { background: rgba(46,125,50,0.12); color: var(--success); }
        .pill-rejected { background: rgba(198,40,40,0.1); color: var(--danger); }
        .pill-archived { background: rgba(0,0,0,0.08); color: var(--text-muted); }
        .locale-tag { font-family: 'Montserrat', monospace; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .pagination { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); }
        .pagination span { font-size: 0.75rem; color: var(--text-muted); }

        /* ============ DRAWER ============ */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 20;
        }
        .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            box-shadow: -10px 0 30px rgba(0,0,0,0.12);
            transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 21;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .drawer.open { transform: translateX(0); }
        .drawer-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .drawer-title { font-size: 1rem; font-weight: 600; }
        .drawer-close {
            border: none;
            background: transparent;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 8px;
        }
        .drawer-body { padding: 18px 22px; flex: 1; }
        .drawer-section { margin-bottom: 22px; }
        .drawer-section h4 {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 0.85rem; border-bottom: 1px dashed var(--border); }
        .kv:last-child { border-bottom: none; }
        .kv .k { color: var(--text-muted); font-size: 0.78rem; }
        .kv .v { color: var(--text-main); text-align: right; word-break: break-word; }
        .drawer-footer {
            padding: 14px 22px;
            border-top: 1px solid var(--border);
            background: var(--surface-2);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* mobile */
        @media (max-width: 720px) {
            .header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .main { padding: 16px; }
            .toolbar .field.search { width: 100%; flex: none; }
            th, td { padding: 8px 10px; font-size: 0.78rem; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

<!-- ============ LOGIN VIEW ============ -->
<div id="login-view">
    <form class="login-card" id="login-form">
        <div class="login-logo">AKBAL</div>
        <div class="login-subtitle">Admin Console</div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign in</button>
        <div id="login-msg" class="msg"></div>
    </form>
</div>

<!-- ============ DASHBOARD VIEW ============ -->
<div id="dashboard-view">
    <header class="header">
        <div class="header-brand">AKBAL <small>ADMIN</small></div>
        <div class="header-right">
            <span class="who" id="who"></span>
            <button class="btn btn-ghost" id="logout-btn">Logout</button>
        </div>
    </header>

    <main class="main">
        <div class="stats" id="stats"></div>

        <div class="toolbar">
            <div class="field">
                <label>Status</label>
                <select id="filter-status">
                    <option value="">All</option>
                    <option value="new">New</option>
                    <option value="reviewing">Reviewing</option>
                    <option value="accepted">Accepted</option>
                    <option value="rejected">Rejected</option>
                    <option value="archived">Archived</option>
                </select>
            </div>
            <div class="field">
                <label>Locale</label>
                <select id="filter-locale">
                    <option value="">All</option>
                    <option value="es">ES</option>
                    <option value="en">EN</option>
                </select>
            </div>
            <div class="field">
                <label>Range</label>
                <select id="filter-range">
                    <option value="">All time</option>
                    <option value="1">Last 24h</option>
                    <option value="7">Last 7 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                </select>
            </div>
            <div class="field search">
                <label>Search (name, email, instagram)</label>
                <input type="text" id="filter-search" placeholder="Type to search...">
            </div>
            <div style="align-self: flex-end;">
                <button class="btn" id="refresh-btn" title="Refresh">↻ Refresh</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th class="hide-mobile">Email</th>
                        <th>Instagram</th>
                        <th class="hide-mobile">WhatsApp</th>
                        <th>Status</th>
                        <th class="hide-mobile">Locale</th>
                    </tr>
                </thead>
                <tbody id="rows-body">
                    <tr><td colspan="7" class="empty">Loading...</td></tr>
                </tbody>
            </table>
            <div class="pagination">
                <span id="pagination-info">—</span>
                <div>
                    <button class="btn" id="prev-btn" disabled>◀ Prev</button>
                    <button class="btn" id="next-btn" disabled>Next ▶</button>
                </div>
            </div>
        </div>
    </main>

    <!-- ============ DRAWER ============ -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-header">
            <div class="drawer-title" id="drawer-title">Application</div>
            <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
        <div class="drawer-footer">
            <button class="btn" id="drawer-cancel">Cancel</button>
            <button class="btn btn-primary" id="drawer-save">Save changes</button>
        </div>
    </aside>
</div>

<script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

    const SUPABASE_URL = "https://flajbagcuwiibhetsmng.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_C0cHWLnWv04H9lK4ofRQBg_uKMEGg9g";
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
    });

    const PAGE_SIZE = 25;
    const state = {
        page: 0,
        total: 0,
        filters: { status: '', locale: '', range: '30', search: '' },
        rows: [],
        current: null
    };

    const $ = (id) => document.getElementById(id);

    // ============ AUTH FLOW ============
    async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            const { data: ok, error } = await supabase.rpc('is_admin');
            if (error || !ok) {
                await supabase.auth.signOut();
                showLogin('Tu cuenta no tiene permisos de admin.');
                return;
            }
            showDashboard(session.user.email);
            await loadAll();
        } else {
            showLogin();
        }
    }

    function showLogin(msg) {
        $('login-view').style.display = 'flex';
        $('dashboard-view').style.display = 'none';
        if (msg) {
            const m = $('login-msg');
            m.textContent = msg;
            m.className = 'msg msg-info';
        }
    }

    function showDashboard(email) {
        $('login-view').style.display = 'none';
        $('dashboard-view').style.display = 'block';
        $('who').textContent = email || '';
    }

    $('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = $('email').value.trim();
        const password = $('password').value;
        const btn = $('login-btn');
        const msg = $('login-msg');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        msg.className = 'msg';
        msg.textContent = '';

        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            const { data: ok, error: adminErr } = await supabase.rpc('is_admin');
            if (adminErr || !ok) {
                await supabase.auth.signOut();
                throw new Error('Tu cuenta no tiene permisos de admin.');
            }
            showDashboard(data.user.email);
            await loadAll();
        } catch (err) {
            msg.textContent = err.message || 'No se pudo iniciar sesión.';
            msg.className = 'msg msg-error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Sign in';
        }
    });

    $('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        $('email').value = '';
        $('password').value = '';
        showLogin();
    });

    // ============ DATA LOAD ============
    function buildQuery() {
        let q = supabase.from('talent_applications').select('*', { count: 'exact' });
        const f = state.filters;
        if (f.status) q = q.eq('status', f.status);
        if (f.locale) q = q.eq('locale', f.locale);
        if (f.range) {
            const days = parseInt(f.range, 10);
            const since = new Date(Date.now() - days * 86400000).toISOString();
            q = q.gte('created_at', since);
        }
        if (f.search) {
            const s = f.search.replace(/[%_]/g, '\\$&');
            q = q.or(`nombre.ilike.%${s}%,email.ilike.%${s}%,instagram.ilike.%${s}%`);
        }
        return q
            .order('created_at', { ascending: false })
            .range(state.page * PAGE_SIZE, state.page * PAGE_SIZE + PAGE_SIZE - 1);
    }

    async function loadAll() {
        await Promise.all([loadStats(), loadRows()]);
    }

    async function loadStats() {
        const { data, error } = await supabase
            .from('talent_applications')
            .select('status', { count: 'exact' });
        if (error) return;
        const counts = { total: data.length, new: 0, reviewing: 0, accepted: 0, rejected: 0, archived: 0 };
        for (const r of data) counts[r.status] = (counts[r.status] || 0) + 1;
        const labels = [
            { k: 'total', label: 'Total', gold: true },
            { k: 'new', label: 'New' },
            { k: 'reviewing', label: 'Reviewing' },
            { k: 'accepted', label: 'Accepted' },
            { k: 'rejected', label: 'Rejected' }
        ];
        $('stats').innerHTML = labels.map(l =>
            `<div class="stat"><div class="stat-label">${l.label}</div><div class="stat-value ${l.gold ? 'gold' : ''}">${counts[l.k] || 0}</div></div>`
        ).join('');
    }

    async function loadRows() {
        $('rows-body').innerHTML = '<tr><td colspan="7" class="empty">Loading...</td></tr>';
        const { data, count, error } = await buildQuery();
        if (error) {
            $('rows-body').innerHTML = `<tr><td colspan="7" class="empty">Error: ${escapeHtml(error.message)}</td></tr>`;
            return;
        }
        state.rows = data || [];
        state.total = count || 0;
        renderRows();
        updatePagination();
    }

    function renderRows() {
        if (!state.rows.length) {
            $('rows-body').innerHTML = '<tr><td colspan="7" class="empty">No applications match the current filters.</td></tr>';
            return;
        }
        $('rows-body').innerHTML = state.rows.map(r => `
            <tr data-id="${r.id}">
                <td>${formatDate(r.created_at)}</td>
                <td>${escapeHtml(r.nombre)}</td>
                <td class="hide-mobile">${escapeHtml(r.email)}</td>
                <td>${escapeHtml(r.instagram)}</td>
                <td class="hide-mobile">${escapeHtml(r.whatsapp)}</td>
                <td><span class="pill pill-${r.status}">${r.status}</span></td>
                <td class="hide-mobile"><span class="locale-tag">${r.locale || '—'}</span></td>
            </tr>
        `).join('');
        $('rows-body').querySelectorAll('tr').forEach(tr => {
            tr.addEventListener('click', () => openDrawer(tr.dataset.id));
        });
    }

    function updatePagination() {
        const from = state.total === 0 ? 0 : state.page * PAGE_SIZE + 1;
        const to = Math.min((state.page + 1) * PAGE_SIZE, state.total);
        $('pagination-info').textContent = state.total === 0
            ? '0 results'
            : `Showing ${from}–${to} of ${state.total}`;
        $('prev-btn').disabled = state.page === 0;
        $('next-btn').disabled = (state.page + 1) * PAGE_SIZE >= state.total;
    }

    $('prev-btn').addEventListener('click', () => {
        if (state.page > 0) { state.page--; loadRows(); }
    });
    $('next-btn').addEventListener('click', () => {
        if ((state.page + 1) * PAGE_SIZE < state.total) { state.page++; loadRows(); }
    });
    $('refresh-btn').addEventListener('click', () => loadAll());

    // Filters
    let searchTimer = null;
    ['filter-status', 'filter-locale', 'filter-range'].forEach(id => {
        $(id).addEventListener('change', () => {
            state.filters[id.replace('filter-', '')] = $(id).value;
            state.page = 0;
            loadAll();
        });
    });
    $('filter-search').addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            state.filters.search = $('filter-search').value.trim();
            state.page = 0;
            loadRows();
        }, 280);
    });

    // ============ DRAWER ============
    function openDrawer(id) {
        const r = state.rows.find(x => x.id === id);
        if (!r) return;
        state.current = r;
        $('drawer-title').textContent = r.nombre;
        $('drawer-body').innerHTML = `
            <div class="drawer-section">
                <h4>Submitted</h4>
                <div class="kv"><span class="k">Date</span><span class="v">${formatDateLong(r.created_at)}</span></div>
                <div class="kv"><span class="k">Locale</span><span class="v">${r.locale || '—'}</span></div>
                <div class="kv"><span class="k">Source</span><span class="v">${escapeHtml(r.source || '—')}</span></div>
            </div>
            <div class="drawer-section">
                <h4>Contact</h4>
                <div class="kv"><span class="k">Email</span><span class="v"><a href="mailto:${encodeURIComponent(r.email)}" style="color:var(--gold-dark)">${escapeHtml(r.email)}</a></span></div>
                <div class="kv"><span class="k">WhatsApp</span><span class="v"><a href="https://wa.me/${encodeURIComponent((r.whatsapp || '').replace(/[^0-9+]/g, ''))}" target="_blank" rel="noopener" style="color:var(--gold-dark)">${escapeHtml(r.whatsapp)}</a></span></div>
                <div class="kv"><span class="k">Instagram</span><span class="v"><a href="https://instagram.com/${encodeURIComponent((r.instagram || '').replace(/^@/, ''))}" target="_blank" rel="noopener" style="color:var(--gold-dark)">${escapeHtml(r.instagram)}</a></span></div>
            </div>
            <div class="drawer-section">
                <h4>Context</h4>
                <div class="kv"><span class="k">Referrer</span><span class="v">${escapeHtml(r.referrer || '—')}</span></div>
                <div class="kv"><span class="k">User agent</span><span class="v" style="font-size:0.75rem">${escapeHtml(r.user_agent || '—')}</span></div>
            </div>
            <div class="drawer-section">
                <h4>Review</h4>
                <div class="field" style="margin-bottom:14px">
                    <label for="drawer-status">Status</label>
                    <select id="drawer-status">
                        <option value="new">New</option>
                        <option value="reviewing">Reviewing</option>
                        <option value="accepted">Accepted</option>
                        <option value="rejected">Rejected</option>
                        <option value="archived">Archived</option>
                    </select>
                </div>
                <div class="field" style="margin-bottom:0">
                    <label for="drawer-notes">Notes (internal)</label>
                    <textarea id="drawer-notes" placeholder="Notes only visible to admins..."></textarea>
                </div>
                <div class="kv" style="margin-top:14px"><span class="k">Reviewed at</span><span class="v">${r.reviewed_at ? formatDateLong(r.reviewed_at) : '—'}</span></div>
            </div>
            <div id="drawer-msg" class="msg"></div>
        `;
        $('drawer-status').value = r.status;
        $('drawer-notes').value = r.notes || '';
        openDrawerUI();
    }

    function openDrawerUI() {
        $('drawer').classList.add('open');
        $('drawer-backdrop').classList.add('open');
        $('drawer').setAttribute('aria-hidden', 'false');
    }
    function closeDrawer() {
        $('drawer').classList.remove('open');
        $('drawer-backdrop').classList.remove('open');
        $('drawer').setAttribute('aria-hidden', 'true');
        state.current = null;
    }
    $('drawer-close').addEventListener('click', closeDrawer);
    $('drawer-cancel').addEventListener('click', closeDrawer);
    $('drawer-backdrop').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && $('drawer').classList.contains('open')) closeDrawer();
    });

    $('drawer-save').addEventListener('click', async () => {
        if (!state.current) return;
        const btn = $('drawer-save');
        const msg = $('drawer-msg');
        const newStatus = $('drawer-status').value;
        const newNotes = $('drawer-notes').value.trim() || null;
        const noChange = newStatus === state.current.status && (newNotes || null) === (state.current.notes || null);
        if (noChange) { closeDrawer(); return; }

        btn.disabled = true;
        btn.textContent = 'Saving...';
        msg.className = 'msg';

        try {
            const { error } = await supabase
                .from('talent_applications')
                .update({ status: newStatus, notes: newNotes })
                .eq('id', state.current.id);
            if (error) throw error;
            await loadAll();
            closeDrawer();
        } catch (err) {
            msg.textContent = err.message || 'Could not save changes.';
            msg.className = 'msg msg-error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save changes';
        }
    });

    // ============ HELPERS ============
    function formatDate(iso) {
        const d = new Date(iso);
        const now = new Date();
        const sameYear = d.getFullYear() === now.getFullYear();
        const month = d.toLocaleString('en-US', { month: 'short' });
        const day = d.getDate();
        const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        return sameYear ? `${month} ${day} ${time}` : `${month} ${day} ${d.getFullYear()}`;
    }
    function formatDateLong(iso) {
        const d = new Date(iso);
        return d.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) + ' UTC';
    }
    function escapeHtml(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ============ BOOT ============
    checkSession();
</script>

</body>
</html>
