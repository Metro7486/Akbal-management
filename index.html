<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akbal Management | Talent Application</title>
    <meta name="description" content="Akbal Management — Talent Application.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --bg-tint: #fbfbfb;
            --hairline: #f1f1f1;
            --hairline-strong: #e6e6e6;
            --ghost: #ededed;
            --whisper: #d4d4d4;
            --mid: #9a9a9a;
            --ink: #111111;
            --ink-soft: #2a2a2a;
            --serif: 'Cormorant Garamond', 'Cormorant', serif;
            --sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: var(--bg); }
        body {
            font-family: var(--sans);
            color: var(--ink);
            min-height: 100vh;
            font-weight: 300;
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px 60px;
            opacity: 0; /* GSAP fade-in handles entrance */
        }

        ::selection { background: var(--ink); color: var(--bg); }

        /* Subtle ambient gradient — barely perceptible, gives depth without breaking white */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 90% 60% at 50% 0%, rgba(0,0,0,0.012), transparent 60%),
                radial-gradient(ellipse 60% 40% at 50% 100%, rgba(0,0,0,0.008), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .lang-toggle {
            position: fixed;
            top: 28px;
            right: 28px;
            display: flex;
            gap: 2px;
            z-index: 100;
            padding: 3px;
            background: rgba(255,255,255,0.6);
            border: 1px solid var(--hairline);
            border-radius: 999px;
            backdrop-filter: blur(8px);
        }
        .lang-btn {
            padding: 6px 14px;
            background: transparent;
            color: var(--whisper);
            border: none;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2.5px;
            cursor: pointer;
            transition: color 0.4s ease;
            border-radius: 999px;
        }
        .lang-btn:hover { color: var(--mid); }
        .lang-btn.active {
            color: var(--ink);
        }

        .container {
            width: 100%;
            max-width: 460px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-family: var(--serif);
            font-size: clamp(3rem, 8vw, 4.2rem);
            font-weight: 300;
            letter-spacing: 0.32em;
            color: var(--ink);
            line-height: 1;
            margin-bottom: 14px;
            margin-right: -0.32em; /* compensate the trailing tracking */
        }
        .subtitle {
            font-family: var(--sans);
            font-size: 9px;
            font-weight: 400;
            color: var(--whisper);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 64px;
        }

        .hero-text {
            font-family: var(--serif);
            font-size: clamp(1.15rem, 3.2vw, 1.4rem);
            font-weight: 300;
            color: var(--ink-soft);
            line-height: 1.55;
            margin-bottom: 16px;
            letter-spacing: 0.005em;
        }
        .hero-text strong {
            font-style: italic;
            font-weight: 400;
            color: var(--ink);
        }
        .hero-text br + br { display: none; }
        .hero-sub {
            font-family: var(--sans);
            font-size: 12.5px;
            font-weight: 300;
            color: var(--mid);
            line-height: 1.7;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }
        .membership-note {
            display: block;
            margin-top: 32px;
            font-family: var(--sans);
            font-size: 9px;
            color: var(--whisper);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 400;
        }

        .divider {
            width: 32px;
            height: 1px;
            background: var(--hairline-strong);
            margin: 48px auto 40px;
        }

        .form-container {
            text-align: left;
            padding: 0;
        }
        .input-group {
            position: relative;
            margin-bottom: 28px;
        }
        .input-group label {
            display: block;
            font-family: var(--sans);
            font-size: 9px;
            color: var(--whisper);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
            transition: color 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .input-group input {
            width: 100%;
            padding: 6px 0 12px;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--hairline-strong);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.01em;
            transition: border-color 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            border-radius: 0;
        }
        .input-group input::placeholder {
            color: var(--ghost);
            font-weight: 300;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--ink);
        }
        .input-group:focus-within label {
            color: var(--ink-soft);
        }
        /* underline reveal on focus */
        .input-group::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            height: 1px;
            width: 0;
            background: var(--ink);
            transition: width 0.55s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .input-group:focus-within::after { width: 100%; }

        .submit-btn {
            width: 100%;
            padding: 17px 24px;
            background: var(--ink);
            color: var(--bg);
            border: 1px solid var(--ink);
            border-radius: 0;
            font-family: var(--sans);
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            transition: background 0.45s ease, color 0.45s ease, transform 0.45s ease, letter-spacing 0.55s ease;
            margin-top: 16px;
            position: relative;
            overflow: hidden;
        }
        .submit-btn:hover {
            background: var(--bg);
            color: var(--ink);
            letter-spacing: 5.5px;
        }
        .submit-btn:active {
            transform: scale(0.985);
        }
        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            letter-spacing: 4px;
        }

        .footer-tags {
            margin-top: 64px;
            font-family: var(--sans);
            font-size: 9px;
            color: var(--whisper);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
        }
        .footer-tags::before, .footer-tags::after {
            content: "·";
            display: inline-block;
            margin: 0 10px;
            color: var(--ghost);
        }

        #loading, #success-message, #error-message {
            display: none;
            margin-top: 28px;
            font-family: var(--sans);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-align: center;
        }
        #loading { color: var(--mid); }
        #success-message {
            color: var(--ink);
            font-family: var(--serif);
            font-size: 18px;
            font-weight: 400;
            font-style: italic;
            line-height: 1.5;
        }
        #error-message { color: var(--ink-soft); }

        /* GSAP setup classes */
        .reveal { opacity: 0; }
        .input-group { opacity: 0; }

        @media (max-width: 480px) {
            body { padding: 60px 20px 40px; }
            .lang-toggle { top: 18px; right: 18px; }
            .logo { letter-spacing: 0.25em; }
            .subtitle { margin-bottom: 48px; letter-spacing: 5px; }
            .divider { margin: 36px auto 32px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

    <div class="lang-toggle reveal">
        <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <div class="container">
        <div class="logo reveal">AKBAL</div>
        <div class="subtitle reveal">Management</div>

        <p class="hero-text reveal" id="hero-text"></p>

        <div class="divider reveal" aria-hidden="true"></div>

        <div class="form-container reveal">
            <form id="application-form">
                <div class="input-group">
                    <label for="name" id="label-name"></label>
                    <input type="text" id="name" name="nombre" required placeholder="">
                </div>
                <div class="input-group">
                    <label for="instagram" id="label-instagram"></label>
                    <input type="text" id="instagram" name="instagram" required placeholder="@tu_usuario">
                </div>
                <div class="input-group">
                    <label for="email" id="label-email"></label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                <div class="input-group">
                    <label for="whatsapp" id="label-whatsapp"></label>
                    <input type="tel" id="whatsapp" name="whatsapp" required placeholder="+52 123 456 7890">
                </div>
                <button type="submit" class="submit-btn" id="submit-btn"></button>
            </form>
            <div id="loading"></div>
            <div id="success-message"></div>
            <div id="error-message"></div>
        </div>

        <div class="footer-tags reveal">Tulum &nbsp;·&nbsp; Riviera Maya &nbsp;·&nbsp; Cancun</div>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

        const SUPABASE_URL = "https://flajbagcuwiibhetsmng.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_C0cHWLnWv04H9lK4ofRQBg_uKMEGg9g";
        const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentLang = 'es';

        const i18n = {
            es: {
                hero: 'Conviértete en una <strong>Arquitecta de Experiencias</strong>.',
                heroSub: 'Únete a la agencia de Social Concierge más exclusiva. Ingresa tus datos para ser considerada en nuestra próxima fase de selección.<span class="membership-note">Membership by application only</span>',
                labelName: 'Nombre Completo',
                placeholderName: 'Tu nombre completo',
                labelInstagram: 'Instagram',
                placeholderInstagram: '@tu_usuario',
                labelEmail: 'Correo Electrónico',
                labelWhatsapp: 'WhatsApp (Con código de país)',
                submit: 'Solicitar Acceso',
                loading: 'Procesando solicitud...',
                success: '“Solicitud recibida.<br>Nos pondremos en contacto contigo.”',
                error: 'Hubo un error al enviar tus datos. Intenta de nuevo.'
            },
            en: {
                hero: 'Become an <strong>Experience Architect</strong>.',
                heroSub: 'Join the most exclusive Social Concierge agency. Enter your details to be considered for our next selection phase.<span class="membership-note">Membership by application only</span>',
                labelName: 'Full Name',
                placeholderName: 'Your full name',
                labelInstagram: 'Instagram',
                placeholderInstagram: '@your_handle',
                labelEmail: 'Email Address',
                labelWhatsapp: 'WhatsApp (With country code)',
                submit: 'Request Access',
                loading: 'Processing request...',
                success: '“Application received.<br>We will be in touch.”',
                error: 'There was an error submitting your info. Please try again.'
            }
        };

        // Ensure a hero-sub element exists right after hero-text for the longer paragraph
        let heroSubEl = document.getElementById('hero-sub');
        if (!heroSubEl) {
            heroSubEl = document.createElement('p');
            heroSubEl.id = 'hero-sub';
            heroSubEl.className = 'hero-sub reveal';
            document.getElementById('hero-text').insertAdjacentElement('afterend', heroSubEl);
        }

        window.setLang = function(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.documentElement.lang = lang;
            document.getElementById('hero-text').innerHTML = t.hero;
            heroSubEl.innerHTML = t.heroSub;
            document.getElementById('label-name').textContent = t.labelName;
            document.getElementById('name').placeholder = t.placeholderName;
            document.getElementById('label-instagram').textContent = t.labelInstagram;
            document.getElementById('instagram').placeholder = t.placeholderInstagram;
            document.getElementById('label-email').textContent = t.labelEmail;
            document.getElementById('label-whatsapp').textContent = t.labelWhatsapp;
            document.getElementById('submit-btn').textContent = t.submit;
            document.getElementById('loading').textContent = t.loading;
            document.getElementById('success-message').innerHTML = t.success;
            document.getElementById('error-message').textContent = t.error;
            document.getElementById('btn-es').classList.toggle('active', lang === 'es');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        }

        setLang('es');

        const form = document.getElementById('application-form');
        const submitBtn = document.getElementById('submit-btn');
        const loading = document.getElementById('loading');
        const successMsg = document.getElementById('success-message');
        const errorMsg = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            const originalLabel = submitBtn.textContent;
            submitBtn.textContent = i18n[currentLang].loading;

            const formData = new FormData(form);
            const payload = {
                nombre: (formData.get('nombre') || '').trim(),
                instagram: (formData.get('instagram') || '').trim(),
                email: (formData.get('email') || '').trim().toLowerCase(),
                whatsapp: (formData.get('whatsapp') || '').trim(),
                source: 'web_application',
                locale: currentLang,
                user_agent: (navigator.userAgent || '').slice(0, 1000) || null,
                referrer: (document.referrer || '').slice(0, 2000) || null
            };

            try {
                const { error } = await supabase
                    .from('talent_applications')
                    .insert(payload);

                if (error) throw error;

                // Premium success transition: fade form out, then fade success in
                gsap.to(form, {
                    opacity: 0,
                    y: -8,
                    duration: 0.6,
                    ease: "power2.inOut",
                    onComplete: () => {
                        form.style.display = 'none';
                        successMsg.style.display = 'block';
                        gsap.fromTo(successMsg,
                            { opacity: 0, y: 8 },
                            { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }
                        );
                    }
                });
            } catch (error) {
                console.error('Submission error:', error);
                submitBtn.disabled = false;
                submitBtn.textContent = originalLabel;
                errorMsg.style.display = 'block';
                gsap.fromTo(errorMsg, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" });
            }
        });

        // ============ PREMIUM ENTRANCE ANIMATIONS ============
        window.addEventListener('load', () => {
            gsap.to('body', { opacity: 1, duration: 0.4, ease: 'power1.out' });

            const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });

            tl.fromTo('.lang-toggle',
                { opacity: 0, y: -8 },
                { opacity: 1, y: 0, duration: 0.9 },
                0.05
            );

            tl.fromTo('.logo',
                { opacity: 0, y: 14, filter: 'blur(8px)', letterSpacing: '0.45em' },
                { opacity: 1, y: 0, filter: 'blur(0px)', letterSpacing: '0.32em', duration: 1.4 },
                0.15
            );
            tl.fromTo('.subtitle',
                { opacity: 0, y: 8, letterSpacing: '12px' },
                { opacity: 1, y: 0, letterSpacing: '6px', duration: 1.2 },
                0.45
            );
            tl.fromTo('.hero-text',
                { opacity: 0, y: 14, filter: 'blur(4px)' },
                { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.1 },
                0.7
            );
            tl.fromTo('#hero-sub',
                { opacity: 0, y: 8 },
                { opacity: 1, y: 0, duration: 0.9 },
                0.95
            );
            tl.fromTo('.divider',
                { opacity: 0, scaleX: 0 },
                { opacity: 1, scaleX: 1, duration: 0.9, transformOrigin: '50% 50%' },
                1.15
            );
            tl.fromTo('.form-container',
                { opacity: 0 },
                { opacity: 1, duration: 0.6 },
                1.3
            );
            tl.fromTo('.input-group',
                { opacity: 0, y: 12 },
                { opacity: 1, y: 0, duration: 0.9, stagger: 0.09 },
                1.35
            );
            tl.fromTo('.submit-btn',
                { opacity: 0, y: 12 },
                { opacity: 1, y: 0, duration: 0.9 },
                1.85
            );
            tl.fromTo('.footer-tags',
                { opacity: 0 },
                { opacity: 1, duration: 0.9 },
                2.0
            );

            // Micro-interaction: cursor-aware glow on submit button
            const btn = document.getElementById('submit-btn');
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                btn.style.background = `radial-gradient(circle at ${x}% 50%, #2a2a2a, #111 70%)`;
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.background = '';
            });
        });
    </script>
</body>
</html>
